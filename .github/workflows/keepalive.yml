# Keeps the free Supabase project awake. Supabase pauses free projects after about a
# week without traffic; one tiny request a day prevents that. The URL and publishable key are
# the same public values that live in index.html, so no secrets are needed.
name: Keep the account service awake

on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the account service
        run: |
          set -e
          URL=$(grep -o "url:'[^']*'" index.html | head -1 | sed "s/url:'//; s/'//")
          KEY=$(grep -o "anonKey:'[^']*'" index.html | head -1 | sed "s/anonKey:'//; s/'//")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Accounts are not configured yet; nothing to ping."; exit 0; fi
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -X POST "$URL/rest/v1/rpc/signup_allowed" -d '{"email":"keepalive@example.invalid"}'
